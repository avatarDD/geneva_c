# profiles for the golden case apply-ext-profile-file
[template web]
filter-tcp = 80,443

[profile tls]
import = web
filter-l7 = tls
strategy = [TCP:flags:PA]-tamper{TCP:window:replace:7}-| \/

[profile off]
skip
filter-tcp = 80

[profile http]
import = web
filter-l7 = http
strategy = [TCP:flags:PA]-tamper{TCP:urgptr:replace:9}-| \/

[profile quic]
filter-udp = 443
filter-l7 = quic
strategy = [UDP:dport:443]-duplicate-| \/
