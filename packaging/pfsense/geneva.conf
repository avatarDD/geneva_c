# /usr/local/etc/geneva/geneva.conf: settings of
# /usr/local/etc/rc.d/geneva.sh (pfSense). The strategy is read from
# STRATEGY_FILE (one line); "geneva.sh reload" re-reads it.

STRATEGY_FILE=/usr/local/etc/geneva/strategy.txt
# ports of the service on the remote side: 80,443 or 8000-8100
PORTS=80,443
# tcp, udp or tcp,udp
PROTO=tcp
# the divert port
QUEUE=310
CONTROL=unix:/var/run/geneva.sock
CONTROL_TOKEN=
LOG_LEVEL=info
LOG_FILE=/var/log/geneva.log
# JSON Lines events: a file, or empty
EVENTS=
# more options of "geneva run", as is
EXTRA=
