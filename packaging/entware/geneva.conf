# /opt/etc/geneva/geneva.conf: settings of /opt/etc/init.d/S51geneva.
# The strategy is read from STRATEGY_FILE (one line); "S51geneva reload"
# re-reads it without dropping connections.

ENABLED=no
STRATEGY_FILE=/opt/etc/geneva/strategy.txt
# ports of the service on the remote side: 80,443 or 8000-8100
PORTS=80,443
# tcp, udp or tcp,udp
PROTO=tcp
# WAN interface (empty: all), like ppp0 or eth3
IFACE=
QUEUE=310
# auto, nft or iptables
FIREWALL=auto
CONTROL=unix:/opt/var/run/geneva.sock
CONTROL_TOKEN=
LOG_LEVEL=info
LOG_FILE=/opt/var/log/geneva.log
# JSON Lines events for zapret-gui and others: a file, or empty
EVENTS=
# more options of "geneva run", as is
EXTRA=

# The agent of a server-side evaluation (docs/SERVER_SIDE.md).
AGENT_ENABLED=no
AGENT_LISTEN=tcp:0.0.0.0:7110
# dial the evaluator instead of listening
AGENT_CONNECT=
AGENT_TOKEN=
AGENT_LOG_FILE=/opt/var/log/geneva-agent.log
