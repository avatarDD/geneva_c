# /etc/geneva/geneva.conf: settings of geneva.service and geneva-agent.service.
# The strategy is read from STRATEGY_FILE (one line); "systemctl reload
# geneva" re-reads it without dropping connections.
STRATEGY_FILE=/etc/geneva/strategy.txt
# ports of the service on the remote side: 80,443 or 8000-8100
PORTS=80,443
# more options of "geneva run": --proto, -i IFACE, --firewall, -e FILE ...
GENEVA_ARGS=-c unix:/run/geneva/geneva.sock
# GENEVA_CONTROL_TOKEN=

# geneva-agent.service: the agent of a server-side evaluation
AGENT_ARGS=--listen tcp:0.0.0.0:7110
GENEVA_AGENT_TOKEN=
