name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests
        run: make -j"$(nproc)" CC=${{ matrix.cc }} CFLAGS="-O1 -g -Werror" test
      # Without --ext every command prints what it printed before the
      # extensions (docs/EXT_ROADMAP.md, X0); with --ext too, for strategies
      # without x-actions. Same snapshots for the build without src/ext/.
      - name: Golden snapshots
        run: tests/golden/run.sh build/geneva
      # the engine's worker contexts and the probes' threads (EXT_ROADMAP 7.1)
      - name: ThreadSanitizer
        if: matrix.cc == 'gcc'
        run: |
          make -j"$(nproc)" CC=gcc O=build-tsan \
            CFLAGS="-O1 -g -Werror -fsanitize=thread" LDFLAGS="-fsanitize=thread" test
      - name: Build without cryptography (EXT_CRYPTO=0)
        run: |
          make -j"$(nproc)" CC=${{ matrix.cc }} O=build-nocrypto EXT_CRYPTO=0 CFLAGS="-O1 -g -Werror" test
      - name: Build without the extensions (EXT=0)
        run: |
          make -j"$(nproc)" CC=${{ matrix.cc }} O=build-noext EXT=0 CFLAGS="-O1 -g -Werror" test
          tests/golden/run.sh build-noext/geneva
      - name: Sanitizers
        if: matrix.cc == 'clang'
        run: |
          make clean
          make -j"$(nproc)" CC=clang O=build-asan \
            CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=address,undefined" test

  # The engine on live traffic: two network namespaces, every firewall backend.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tcpdump ethtool nftables iptables curl
      - run: make -j"$(nproc)" CFLAGS="-O1 -g -Werror"
      - name: e2e (auto, iptables, nft)
        run: sudo env FIREWALLS="auto iptables nft" tests/e2e/run.sh build/geneva
      - name: evaluator e2e (evolve against a keyword censor)
        run: sudo tests/e2e/evolve.sh build/geneva
      - name: censors e2e (Geneva's lab censors on a router namespace, server side)
        run: sudo env CENSOR_LOG=debug tests/e2e/censors.sh build/geneva
      - name: service scripts e2e (Entware, OpenWrt procd)
        run: sudo tests/e2e/initscripts.sh build/geneva

  # Lab censors 12-20 (--ext), and the official nfqws2 with reference
  # strategies getting past them (docs/CENSOR.md). zapret2 comes from its
  # official release, checked against the hash Zapret2_AutoTuner pins.
  censors-ext:
    runs-on: ubuntu-24.04
    env:
      ZAPRET2_TAG: v1.0.6
      ZAPRET2_SHA256: e141b51b60c895fe9548f4d644365461dcad8155e068d284a9aae1724504237d
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ethtool nftables iptables curl openssl unzip tcpdump
      - run: make -j"$(nproc)" CFLAGS="-O1 -g -Werror"
      - name: zapret2 release
        run: |
          curl -fsSL -o zapret2.zip \
            "https://github.com/bol-van/zapret2/releases/download/$ZAPRET2_TAG/zapret2-$ZAPRET2_TAG.zip"
          echo "$ZAPRET2_SHA256  zapret2.zip" | sha256sum -c -
          sudo mkdir -p /opt/zapret2 && sudo unzip -q zapret2.zip -d /opt/zapret2
          dir=$(dirname "$(dirname "$(dirname "$(find /opt/zapret2 -path '*/binaries/linux-x86_64/nfqws2' | head -1)")")")
          sudo chmod -R a+rX /opt/zapret2 && sudo chmod +x "$dir/binaries/linux-x86_64/nfqws2"
          echo "NFQWS2_DIR=$dir" >> "$GITHUB_ENV"
      - name: censors 12-20, nfqws2 against them, posdebug parity
        run: sudo env NFQWS2_DIR="$NFQWS2_DIR" tests/e2e/censors_x.sh build/geneva

  # Fuzzing (docs/EXT_ROADMAP.md, 7.2): selftest's random inputs under
  # ASan and UBSan, then libFuzzer 60 s per target. A crash prints its
  # input in base64 (no artifact upload: the storage quota is exhausted).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-18-dev
      - name: selftest under the sanitizers
        run: |
          make -j"$(nproc)" O=build-fuzz CC=clang \
            CFLAGS="-O1 -g -fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            LDFLAGS="-fsanitize=fuzzer-no-link,address,undefined" build-fuzz/geneva
          build-fuzz/geneva selftest --ext --fuzz 20000 --seed "$GITHUB_RUN_ID" --crash-dir crashes
      - name: libFuzzer, 60 s per target
        run: WORK=fuzz-work tests/fuzz/run.sh 60
      - name: crashing inputs
        if: failure()
        run: |
          for f in crashes/* fuzz-work/*/crash-* fuzz-work/*/leak-* fuzz-work/*/timeout-*; do
            [ -f "$f" ] && echo "$f: $(base64 -w0 "$f")"
          done
          true

  musl-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: make -j"$(nproc)" CC=musl-gcc STATIC=1 SMALL=1 CFLAGS="-Werror" test
      # size of src/ext/ in the router build; the budget grows by stage (6.1)
      # X2 (lab censors 12-20, TLS/QUIC reading, AES-GCM/HKDF): about 16 KB
      # X3 (conntrack, ranges, FLOW:/META: triggers): about 8 KB more
      # X5a (x-actions, blobs, tls_mod, the sending path): about 48 KB more
      # X6c (autolist, ipcache): about 16 KB more
      # X7c (fuzz targets and seeds, geneva selftest): about 24 KB more
      - run: tools/ext_size.sh 245760 CC=musl-gcc CFLAGS="-Werror"
      - run: tools/ext_size.sh 233472 CC=musl-gcc CFLAGS="-Werror" EXT_CRYPTO=0
      # the fuzz targets on musl (fork, alarm, fmemopen), seeds and 2000 inputs each
      - run: build/geneva selftest --ext --fuzz 2000 --seed 1
      - run: ls -la build/geneva && file build/geneva

  windows-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: make -j"$(nproc)" CC=x86_64-w64-mingw32-gcc STATIC=1 CFLAGS="-O2 -Werror"
      - run: make -j"$(nproc)" CC=x86_64-w64-mingw32-gcc STATIC=1 O=build-noext EXT=0 CFLAGS="-O2 -Werror"
      # No upload-artifact here: the account's Actions artifact storage quota
      # is exhausted, and releases publish binaries directly instead.
      - run: ls -la build/geneva.exe && file build/geneva.exe

  # Native Windows build, unit tests and a live smoke test of the WinDivert
  # engine. WinDivert comes from its author's official release, pinned by
  # version and SHA-256.
  windows:
    runs-on: windows-latest
    env:
      WINDIVERT_VERSION: 2.2.2
      WINDIVERT_SHA256: 63cb41763bb4b20f600b6de04e991a9c2be73279e317d4d82f237b150c5f3f15
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc make unzip
      - run: make -j4 CC=gcc STATIC=1 CFLAGS="-O2 -Werror"
      - run: make CC=gcc STATIC=1 CFLAGS="-O2 -Werror" test
      # the fuzz targets in the process (no fork on Windows; pcap via tmpfile)
      - run: ./build/geneva.exe selftest --ext --fuzz 2000 --seed 1
      - name: Fetch WinDivert (official release)
        run: |
          curl -fsSL -o windivert.zip "https://github.com/basil00/WinDivert/releases/download/v${WINDIVERT_VERSION}/WinDivert-${WINDIVERT_VERSION}-A.zip"
          echo "${WINDIVERT_SHA256}  windivert.zip" | sha256sum -c -
          unzip -q windivert.zip
          cp "WinDivert-${WINDIVERT_VERSION}-A/x64/WinDivert.dll" "WinDivert-${WINDIVERT_VERSION}-A/x64/WinDivert64.sys" build/
      - name: Smoke test
        shell: pwsh
        run: ./tests/windows/smoke.ps1 -Bin build/geneva.exe

  # Differential test against the Python Geneva at a pinned commit: the same
  # strategies must parse and print alike and produce identical packets.
  geneva-diff:
    runs-on: ubuntu-22.04
    env:
      GENEVA_COMMIT: 61a4a5104641ddbba6dd0526013e85a5be875203
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Fetch Geneva
        run: |
          git clone -q https://github.com/Kkevsterrr/geneva "$RUNNER_TEMP/geneva"
          git -C "$RUNNER_TEMP/geneva" checkout -q "$GENEVA_COMMIT"
      - run: pip install scapy==2.4.3 anytree
      - run: make -j"$(nproc)"
      - name: Strategy corpus is up to date
        run: python tools/extract_strategies.py "$RUNNER_TEMP/geneva" | diff -u tests/geneva_strategies.h -
      - name: Strategy library is up to date
        run: python tools/gen_library.py "$RUNNER_TEMP/geneva" | diff -u src/library_data.h -
      - name: Compare with Geneva
        run: python tools/geneva_diff.py --geneva "$RUNNER_TEMP/geneva" --bin build/geneva -v
